[env:dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
lib_deps =
    https://github.com/lvgl/lvgl.git#v8.3.11
    https://github.com/Bodmer/TFT_eSPI.git#v2.5.33
    https://github.com/NetRat/Base32.git#1c65e655360882074f33837ae53f777aee88418e
    https://github.com/fbiego/ESP32Time.git#cefc6857b583ae5478000da897c838a6bf6d3275
    https://github.com/bblanchon/ArduinoJson.git#v7.0.4
build_flags =
    -Ofast
    -Wall
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    -D USER_SETUP_LOADED=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D ILI9341_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BCKL=21
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SMOOTH_FONT=1
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_CLK=25
    -D TOUCH_CS=33
    -D LV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"
    -D CORE_DEBUG_LEVEL=3

[env:prod]
extends = env:dev
build_unflags = -D CORE_DEBUG_LEVEL=3
build_flags =
    ${env:dev.build_flags}
    -D CORE_DEBUG_LEVEL=0
